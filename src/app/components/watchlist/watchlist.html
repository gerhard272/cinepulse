<div class="watchlist-container">
  <h2>La mia Watchlist</h2>

  @if (watchlistService.isWatchlistEmpty()) {
    <div class="empty-watchlist">
      <p>La tua watchlist è vuota. Aggiungi qualche contenuto per ritrovarlo qui!</p>
    </div>
  } @else {
    <ul class="watchlist-list">
      @for (item of watchlistService.watchlist(); track item.movieId) {
        <li class="watchlist-item">
          <!-- TODO: Mostrare dettagli del film invece del solo ID -->
          <p>Movie ID: {{ item.movieId }}</p>
          <p>Aggiunto il: {{ item.addedAt }}</p>
          <button (click)="watchlistService.removeFromWatchlist(item.movieId)">Rimuovi</button>
        </li>
      }
    </ul>
  }
</div>
