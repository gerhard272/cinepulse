<div class="movie-card" [routerLink]="['/movies', movie.id]">
  <div class="poster-wrapper">
    <img
      [src]="movie.posterUrl || 'https://via.placeholder.com/500x750?text=No+Poster'"
      [alt]="movie.title"
      class="poster"
    />
    <div class="card-overlay">
      <button
        class="watchlist-btn"
        (click)="onAddToWatchlist($event)"
        title="Aggiungi alla Watchlist"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
        </svg>
      </button>
    </div>
    @if (movie.rating) {
      <span class="rating-badge">{{ movie.rating }}</span>
    }
  </div>
  <div class="card-body">
    <h3 class="title">{{ movie.title | titlecase }}</h3>
    <p class="meta">
      <span>{{ movie.releaseYear }}</span>
      <span class="separator">|</span>
      <span>{{ movie.genre }}</span>
    </p>
    <span class="availability-badge" [class]="movie.availability">
      {{ movie.availability === 'both' ? 'Cinema & Streaming' : movie.availability | titlecase }}
    </span>
  </div>
</div>
